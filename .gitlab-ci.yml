# GitLab Pages is retired: it now serves nothing but a redirect to
# markdown2pdf.github.io. No build, no tests — those run on GitHub Actions.

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    # _redirects gives real 301s; the HTML is the fallback for clients that
    # land on a cached page or ignore it.
    - echo '/* https://markdown2pdf.github.io/:splat 301' > public/_redirects
    - |
      cat > public/index.html <<'HTML'
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=https://markdown2pdf.github.io/" />
          <link rel="canonical" href="https://markdown2pdf.github.io/" />
          <title>md2pdf has moved</title>
          <script>
            location.replace('https://markdown2pdf.github.io' + location.pathname + location.search + location.hash);
          </script>
        </head>
        <body>
          <p>md2pdf has moved to <a href="https://markdown2pdf.github.io/">markdown2pdf.github.io</a>.</p>
        </body>
      </html>
      HTML
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
