<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- No `maximum-scale`/`user-scalable=no`: blocking pinch zoom fails
		     WCAG 1.4.4. The 16px control rule in global.css is what actually
		     stops iOS zooming in on focus. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// The GitLab Pages copy is retired; send it to the canonical host
			// before anything else loads. `replace` keeps it out of history.
			if (location.hostname === 'markdown2pdf.gitlab.io')
				location.replace(
					'https://markdown2pdf.github.io' + location.pathname + location.search + location.hash,
				);
		</script>
		<script>
			// Before first paint, so a dark session never flashes white.
			try {
				var t = localStorage.getItem('md2pdf-theme');
				if (t !== 'light' && t !== 'dark')
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', t === 'dark' ? '#1c1c1c' : '#ffffff');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
