# Tests + GitHub Pages deploy for md2pdf.
# The web app lives in web/ (static SvelteKit, adapter-static); web/build is
# what gets published.
name: CI and Pages deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The engine holds both renderers (Typst markup and HTML) plus their parity
  # guard, so its unit tests are the ones that matter most for regressions.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo test
        working-directory: engine

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run check
      - run: npm test
      # The browser tests cover what unit tests structurally cannot: the
      # document the app actually renders.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: [engine, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Vite plugins copy the md2pdf package + fonts from the repo (no
      # network, no Rust) — engine.wasm is committed, so a plain npm build works.
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'markdown2pdf/markdown2pdf.github.io'
    # Allow only one concurrent deployment, skipping runs queued between the run
    # in-progress and latest queued, but never cancel an in-progress deploy.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
