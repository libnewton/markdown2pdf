# GitHub Pages deploy for md2pdf. Build only — tests live in ci.yml.
# The web app lives in web/ (static SvelteKit, adapter-static); web/build is
# what gets published.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'markdown2pdf/markdown2pdf.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Vite plugins copy the md2pdf package + fonts from the repo (no
      # network, no Rust) — engine.wasm is committed, so a plain npm build works.
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
