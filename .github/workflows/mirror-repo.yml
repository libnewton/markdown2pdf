# GitLab hosts the live site, so main has to land there on every push.
name: Mirror to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load deploy key
        env:
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$GITLAB_SSH_KEY" > ~/.ssh/id_gitlab
          chmod 600 ~/.ssh/id_gitlab
          ssh-keyscan -t rsa,ecdsa,ed25519 gitlab.com >> ~/.ssh/known_hosts

      - name: Push main to GitLab
        run: |
          git -c core.sshCommand='ssh -i ~/.ssh/id_gitlab -o IdentitiesOnly=yes' \
            push --force \
            git@gitlab.com:markdown2pdf/markdown2pdf.gitlab.io.git \
            HEAD:refs/heads/main
